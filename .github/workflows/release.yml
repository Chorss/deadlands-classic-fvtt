name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  release:
    name: Build & publish Foundry release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for compare link)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches system.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('system.json','utf8')).version)")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match system.json version '$VERSION'"
            exit 1
          fi
          PKG_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match package.json version '$PKG_VERSION'"
            exit 1
          fi
          LOCK_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package-lock.json','utf8')).version)")
          if [ "$TAG" != "$LOCK_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match package-lock.json version '$LOCK_VERSION'"
            exit 1
          fi
          MOD_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('content/module.json','utf8')).version)")
          if [ "$TAG" != "$MOD_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match content/module.json version '$MOD_VERSION'"
            exit 1
          fi

      # The release job used to be a strict subset of CI (no Biome, no audit-css,
      # no audit-i18n), resting on "tags only ever land on a green main". One line
      # closes that gap.
      - name: Canonical repository gate
        run: npm run verify:ci

      - name: Extract release notes from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v v="$TAG" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::No CHANGELOG.md section found for [$TAG]. Did /release forget to update it?"
            exit 1
          fi
          PREV=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREV" ]; then
            {
              echo ""
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            } >> /tmp/notes.md
          fi
          echo "--- release notes preview ---"
          cat /tmp/notes.md

      # Every release through 0.4.0 shipped `packs/_source/**.json` and zero
      # LevelDB, because this job never ran the packer. Foundry silently creates
      # a missing compendium as empty, so the failure was invisible to install.
      - name: Build compendium packs (system + content module)
        run: |
          npm run pack
          npm run pack:content

      # `manifest` stays on `latest` (a stable URL Foundry re-checks for updates,
      # matching dnd5e); `download` is pinned to THIS tag, so installing an older
      # version from the registry's version history fetches that version's zip
      # rather than whatever is newest. Build-time rewrite only — never committed.
      - name: Pin download URLs to this tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          node -e '
            const fs = require("fs");
            const [file, url] = process.argv.slice(1);
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            json.download = url;
            fs.writeFileSync(file, `${JSON.stringify(json, null, 2)}\n`);
            console.log(`${file}: download -> ${url}`);
          ' system.json "${BASE}/deadlands-classic.zip"
          node -e '
            const fs = require("fs");
            const [file, url] = process.argv.slice(1);
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            json.download = url;
            fs.writeFileSync(file, `${JSON.stringify(json, null, 2)}\n`);
            console.log(`${file}: download -> ${url}`);
          ' content/module.json "${BASE}/deadlands-classic-content.zip"

      - name: Build deadlands-classic.zip
        run: |
          PKG_FILES=( system.json module lang fonts README.md LICENSE CHANGELOG.md )
          for d in templates styles packs assets; do
            [ -d "$d" ] && PKG_FILES+=( "$d" )
          done
          zip -r /tmp/deadlands-classic.zip "${PKG_FILES[@]}" \
            -x "*.DS_Store" "*/.gitkeep" "packs/_source/*"
          echo "--- zip contents ---"
          unzip -l /tmp/deadlands-classic.zip
          # Safety net: forbidden paths must never appear in the shipped zip.
          # `content` is listed because the registry build ships the engine only.
          if unzip -l /tmp/deadlands-classic.zip | grep -Eq "(^|[[:space:]])(books|\.pdf-extract|DeadlandsClassic|Deadlands-Classic|content|tests|tools|docs|scripts|node_modules|\.git|\.github|\.githooks|\.claude|\.idea|package\.json|package-lock\.json|biome\.json|\.mcp\.json)(/|$)"; then
            echo "::error::Forbidden path detected in release zip — refusing to publish"
            exit 1
          fi

      # Module paths are relative to the MODULE root, and module.json must sit at
      # the archive root — so this zip is built from inside content/, not the repo root.
      - name: Build deadlands-classic-content.zip
        run: |
          cp LICENSE content/LICENSE
          cd content
          zip -r /tmp/deadlands-classic-content.zip \
            module.json packs README.md LICENSE \
            -x "*.DS_Store" "*/.gitkeep" "_source/*"
          echo "--- content zip contents ---"
          unzip -l /tmp/deadlands-classic-content.zip

      # The positive gate: every path the manifest declares must exist INSIDE the
      # archive. Purely negative checks let 0.4.0 ship with no packs and no fonts.
      - name: Verify archive contents against manifests
        run: |
          node tools/verify-package.mjs system.json /tmp/deadlands-classic.zip \
            --require-pinned-download
          node tools/verify-package.mjs content/module.json /tmp/deadlands-classic-content.zip \
            --require-pinned-download

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file /tmp/notes.md \
              --latest
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file /tmp/notes.md \
              --latest
          fi
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            system.json \
            content/module.json \
            /tmp/deadlands-classic.zip \
            /tmp/deadlands-classic-content.zip

  publish-foundry:
    name: Publish system to Foundry
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Validate Foundry package release
        env:
          FOUNDRY_PACKAGE_RELEASE_TOKEN: ${{ secrets.FOUNDRY_PACKAGE_RELEASE_TOKEN }}
        run: node tools/publish-foundry-release.mjs --dry-run

      - name: Publish Foundry package release
        env:
          FOUNDRY_PACKAGE_RELEASE_TOKEN: ${{ secrets.FOUNDRY_PACKAGE_RELEASE_TOKEN }}
        run: node tools/publish-foundry-release.mjs
